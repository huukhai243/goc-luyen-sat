<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khóa SAT 1600</title>
<style>
  body { margin: 0; font: 15px/1.6 system-ui, "Segoe UI", sans-serif; background: #f4f5f7; color: #1a2130; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #dadfe7; border-radius: 10px; padding: 22px; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; background: #eceef2; border-radius: 6px; }
  .muted { color: #737c8f; }
  a { color: #2d63d6; }
</style>
</head>
<body>
<main>
  <div class="card" id="box"><p class="muted">Đang tải khóa học…</p></div>
</main>
<script>
const USER_ID = "demo-user"; // DEMO: thực tế là người đang đăng nhập
const box = document.getElementById("box");

fetch("/api/courses/sat-1600/lessons?userId=" + encodeURIComponent(USER_ID))
  .then(async (res) => {
    const data = await res.json();
    if (!res.ok) {
      box.innerHTML = `<h1>Chưa mở khóa</h1><p>${data.error}. <a href="/buy.html">Mua khóa học</a></p>`;
      return;
    }
    box.innerHTML = `<h1></h1><ul></ul>`;
    box.querySelector("h1").textContent = data.course;
    const ul = box.querySelector("ul");
    data.lessons.forEach((l) => {
      const li = document.createElement("li");
      li.innerHTML = `<span></span><span class="muted"></span>`;
      li.children[0].textContent = l.title;
      li.children[1].textContent = l.minutes + " phút";
      ul.append(li);
    });
  })
  .catch(() => { box.innerHTML = '<p>Không tải được khóa học. Thử tải lại trang.</p>'; });
</script>
</body>
</html>
